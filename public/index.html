<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetaí — Gestão de Projetos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

  <!-- ══ TELA DE LOGIN ══════════════════════════════════════════════════════ -->
  <div id="login-screen" class="login-wrap">
    <div class="login-card">
      <div class="login-logo mono" id="login-logo">Projetaí</div>
      <p class="login-sub" id="login-sub">Gestão de projetos com classificação Cynefin</p>
      <form id="login-form">
        <label class="field-label">E-mail</label>
        <input type="email" id="login-email" class="input" placeholder="usuario@empresa.com" required />
        <label class="field-label">Senha</label>
        <input type="password" id="login-senha" class="input" placeholder="••••••••" required />
        <p id="login-erro" class="login-erro hidden"></p>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <p class="login-footer">v1.0.0 · Acesso restrito a membros cadastrados</p>
    </div>
  </div>

  <!-- ══ APLICAÇÃO ══════════════════════════════════════════════════════════ -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo mono" id="sidebar-logo">Projetaí</div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="btn-sair">⏻ <span>Sair</span></button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span id="screen-title" class="mono">Dashboard</span>
          <span id="screen-breadcrumb" class="breadcrumb">/ visão geral</span>
        </div>
        <span id="user-badge" class="user-badge"></span>
      </header>
      <main id="screen" class="screen"></main>
    </div>
  </div>

  <!-- Modal de confirmação -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-card">
      <p id="modal-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost">Cancelar</button>
        <button id="modal-confirm" class="btn btn-danger">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
